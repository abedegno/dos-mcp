name: Release

# Publishing is driven by a tag rather than a branch push so that cutting a release
# is a deliberate act with a name, and so a re-run publishes exactly what was tagged.
on:
  push:
    tags: ["v*"]

# Pinned to ubuntu-24.04 rather than ubuntu-latest, which begins migrating to Ubuntu
# 26.04 on 2026-10-19 over several weeks. A release is rare and has to work on the day
# you want it, so there is no upside to it riding a moving label. The future-image job
# in integration.yml is what tells us when 26.04 is safe to move to.

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required twice over: it is how the OIDC token for trusted publishing is minted,
      # and it is what lets npm attach provenance linking the package to this run.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24, not 22, only in this job. Trusted publishing needs npm 11.5.1 or
          # newer and Node 22 still bundles npm 10.9.x. The verify job above stays on 22
          # so the tests keep running near the version floor package.json declares.
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # prepack runs the build, so the published tarball cannot contain a stale dist.
      - name: Refuse to publish if the tag does not match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies $tag but package.json says $pkg" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg"
      # No NODE_AUTH_TOKEN. Authentication is OIDC via the trusted publisher configured
      # on the package, which is why id-token: write above is load bearing rather than
      # merely enabling provenance. Provenance is generated automatically under trusted
      # publishing, so the explicit --provenance flag is gone too.
      - run: npm publish --access public

  # Separate job, gated on a successful publish, so a GitHub release can never claim a
  # version that npm does not have. It also keeps permissions minimal per job: publish
  # needs id-token, this needs contents: write, and neither needs the other's.
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Cut the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          # Everything between this version's heading and the next one.
          awk -v v="## [$version]" '
            index($0, v) == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no section for [$version], refusing to cut an empty release" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"
